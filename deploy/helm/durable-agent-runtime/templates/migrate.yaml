apiVersion: batch/v1
kind: Job
metadata:
  name: dar-migrate-{{ .Release.Revision }}
  {{- if not .Values.localDependencies.enabled }}
  annotations: { "helm.sh/hook": pre-install,pre-upgrade, "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded }
  {{- end }}
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: "{{ .Values.images.migrate.repository }}:{{ .Values.images.migrate.tag }}"
          imagePullPolicy: {{ .Values.images.migrate.pullPolicy }}
          env: [{ name: POSTGRES_URL, value: {{ .Values.external.migrationPostgresUrl | quote }} }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] }, runAsNonRoot: false, seccompProfile: { type: RuntimeDefault } }
