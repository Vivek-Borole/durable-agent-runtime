name: durable-agent-runtime
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dar
      POSTGRES_PASSWORD: dar
      POSTGRES_DB: dar
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dar -d dar"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    image: postgres:17-alpine
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: dar
    volumes:
      - ./db/migrations:/migrations:ro
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        psql -h postgres -U dar -d dar -v ON_ERROR_STOP=1 -c 'create table if not exists schema_migrations (name text primary key, applied_at timestamptz not null default now())';
        for file in /migrations/*.sql; do name=$$(basename "$${file}");
        applied=$$(psql -h postgres -U dar -d dar -Atc "select 1 from schema_migrations where name = '$${name}'");
        if [ "$${applied}" != 1 ]; then psql -h postgres -U dar -d dar -v ON_ERROR_STOP=1 -f "$${file}";
        psql -h postgres -U dar -d dar -v ON_ERROR_STOP=1 -c "insert into schema_migrations (name) values ('$${name}')"; fi; done
  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data"]
    ports: ["4222:4222", "8222:8222"]
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.126.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports: ["4317:4317", "4318:4318"]
  prometheus:
    image: prom/prometheus:v3.6.0
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus-rules.yaml:/etc/prometheus/rules/slo.yaml:ro
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
