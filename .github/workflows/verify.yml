name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ts
      - run: pnpm typecheck
      - run: pnpm build
      - run: go test -race ./...
      - run: pnpm audit --audit-level=high
      - run: pnpm evidence:check
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/durable-agent-runtime
      - run: helm template dar deploy/helm/durable-agent-runtime -f deploy/helm/durable-agent-runtime/values-kind.yaml >/tmp/dar-rendered.yaml
  container-and-kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: dar-v02
      - run: ./scripts/kind-smoke.sh
  compose-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d postgres nats redis otel-collector
      - run: docker compose run --rm migrate
      - run: POSTGRES_URL=postgres://dar_control:dar-control-local-only@127.0.0.1:5432/dar DAR_WORKER_POSTGRES_URL=postgres://dar_worker:dar-worker-local-only@127.0.0.1:5432/dar DAR_TEST_ADMIN_POSTGRES_URL=postgres://dar:dar@127.0.0.1:5432/dar NATS_URL=nats://127.0.0.1:4222 pnpm test
      - if: always()
        run: docker compose logs --no-color
