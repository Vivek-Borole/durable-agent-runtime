name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ts
      - run: pnpm typecheck
      - run: pnpm build
      - run: go test -race ./...
      - run: pnpm audit --audit-level=high
  compose-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d postgres nats redis otel-collector
      - run: docker compose run --rm migrate
      - run: POSTGRES_URL=postgres://dar:dar@127.0.0.1:5432/dar NATS_URL=nats://127.0.0.1:4222 pnpm test
      - if: always()
        run: docker compose logs --no-color
