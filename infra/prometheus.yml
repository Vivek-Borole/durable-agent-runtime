global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: durable-agent-runtime-control-plane
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3001"]
  - job_name: durable-agent-runtime-worker
    static_configs:
      - targets: ["host.docker.internal:9091"]
  - job_name: durable-agent-runtime-publisher
    static_configs:
      - targets: ["host.docker.internal:9092"]
